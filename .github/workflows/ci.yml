name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (format / lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used for local verification and declared in
      # package.json devEngines; "latest" drifts independently of bun.lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  rust:
    name: Rust (keymesh-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # crates/keymesh-core/rust-toolchain.toml pins the exact channel for
      # every rustup-managed invocation (local + CI).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/keymesh-core

      - name: Format check
        working-directory: crates/keymesh-core
        run: cargo fmt --all -- --check

      - name: Test
        working-directory: crates/keymesh-core
        run: cargo test --all-features --locked

      - name: Clippy
        working-directory: crates/keymesh-core
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  foundry:
    name: Foundry (contracts/ethereum)
    runs-on: ubuntu-latest
    steps:
      # forge-std and openzeppelin-contracts are pinned git submodules under
      # contracts/ethereum/lib (see remappings.txt); a default checkout leaves
      # them empty, so they MUST be initialized here.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Matches the release used for local verification.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build
        working-directory: contracts/ethereum
        run: forge build

      - name: Test
        working-directory: contracts/ethereum
        run: forge test -vvv
