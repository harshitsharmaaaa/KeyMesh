name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx biome format .

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  rust:
    name: Rust (keymesh-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/keymesh-core

      - name: Test
        working-directory: crates/keymesh-core
        run: cargo test --all-features --locked

      - name: Clippy
        working-directory: crates/keymesh-core
        run: cargo clippy --all-targets -- -D warnings

  foundry:
    name: Foundry (contracts/ethereum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        working-directory: contracts/ethereum
        run: forge install foundry-rs/forge-std --no-commit

      - name: Build
        working-directory: contracts/ethereum
        run: forge build --sizes

      - name: Test
        working-directory: contracts/ethereum
        run: forge test -vvv
