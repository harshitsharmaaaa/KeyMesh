[package]
name = "keymesh-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "KeyMesh protocol core: recovery state machine, policies, serialization, and crypto boundaries."
license = "MIT OR Apache-2.0"

[dependencies]
# Keccak-256 for canonical transaction digests (KEYMESH_TX_V1). Required so
# this crate produces byte-identical digests to the Solidity contracts and
# TypeScript protocol package (shared test vectors enforce this). This is a
# hash function dependency only; asymmetric cryptography remains behind the
# CryptoProvider trait and will adopt reviewed implementations in Phase 2.
tiny-keccak = { version = "2", features = ["keccak"] }

[dev-dependencies]
