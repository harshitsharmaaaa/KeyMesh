[package]
name = "keymesh-tss"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "KeyMesh Phase 2.3 real threshold ECDSA (CGGMP24 via synedrion, isolated, not production)"
license = "MIT OR Apache-2.0"

[dependencies]
synedrion = { version = "0.3", features = ["k256"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"
hex = "0.4"
tiny-keccak = { version = "2", features = ["keccak"] }
manul = { version = "0.2", features = ["dev"] }
ecdsa = "0.16"
thiserror = "1.0"

[dev-dependencies]
