[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 64 }

# Dependencies are git submodules under lib/ (see .gitmodules at repo root):
#   git submodule update --init --recursive
# remappings.txt maps forge-std and @openzeppelin/contracts.

[fmt]
line_length = 100
bracket_spacing = false
